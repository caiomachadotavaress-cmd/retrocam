name: Compilar APK Android
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Capacitor CLI & Gerar Projeto
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Meu App Web" "com.meuempresa.meuapp" --web-dir .
          npx cap add android
          npx cap sync android

      - name: Compilar APK Debug com Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: Meu_App_Web-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
